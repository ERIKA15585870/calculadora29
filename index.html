<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Precios con Ganancia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    body {
      background-color: #28a745; /* Verde */
      color: orange; /* Letras naranjas */
      font-family: Arial, sans-serif;
    }
    .card {
      background-color: white;
      color: black;
    }
    .emoji {
      font-size: 2rem;
    }
    .footer-msg {
      margin-top: 30px;
      font-size: 1.2rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg p-4 animate__animated animate__fadeInDown">
          <h2 class="text-center mb-4">🧮 Calculadora de Precios</h2>

          <div class="mb-3">
            <label for="costo" class="form-label">Costo base ($):</label>
            <input type="number" id="costo" class="form-control" placeholder="Ingresa el costo">
          </div>

          <div class="mb-3">
            <label for="ganancia" class="form-label">Porcentaje de ganancia (%):</label>
            <input type="number" id="ganancia" class="form-control" placeholder="Ej. 30">
          </div>

          <div class="d-grid mb-3">
            <button onclick="calcularPrecio()" class="btn btn-success">Calcular 💰</button>
          </div>

          <div id="resultado" class="animate__animated animate__fadeInUp" style="display: none;">
            <h4 class="text-center">📊 Resultado:</h4>
            <p><strong>Precio final sugerido:</strong> $<span id="precioFinal"></span></p>
            <p><strong>Ganancia estimada:</strong> $<span id="margenGanancia"></span></p>
          </div>
        </div>

        <div class="footer-msg mt-5 animate__animated animate__fadeIn">
          ¡Gracias por su visita! 😊
        </div>
      </div>
    </div>
  </div>

  <script>
    function calcularPrecio() {
      const costo = parseFloat(document.getElementById("costo").value);
      const ganancia = parseFloat(document.getElementById("ganancia").value);

      if (isNaN(costo) || isNaN(ganancia)) {
        alert("Por favor ingresa valores válidos.");
        return;
      }

      const precioFinal = costo + (costo * ganancia / 100);
      const margenGanancia = precioFinal - costo;

      document.getElementById("precioFinal").textContent = precioFinal.toFixed(2);
      document.getElementById("margenGanancia").textContent = margenGanancia.toFixed(2);
      document.getElementById("resultado").style.display = "block";
    }
  </script>

</body>
</html>
